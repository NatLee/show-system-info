name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The newest Ubuntu image no longer ships Python 3.7, which the package still supports.
          - os: ubuntu-22.04
            python: "3.7"
          # The package is marked "OS Independent": also run on Windows and macOS.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Run tests
        # Runs tox with the Python version on PATH and lists the slowest tests
        run: tox -e py -- --durations=10
      - name: Run showsys on this machine
        # Shows the real output and how long it takes on each OS
        shell: bash
        run: |
          pip install .
          time showsys -d
          time showsys --all
          showsys --sensors
          showsys --watch 0.5 --count 3
          showsys --all --json > all.json
          python -c "import json; data = json.load(open('all.json')); print(sorted(data))"

  gpu-extra:
    # The optional NVIDIA extra on a machine without an NVIDIA driver: must say N/A, not crash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the gpu extra
        run: pip install ".[gpu,test]"
      - name: Run tests with nvidia-ml-py installed
        run: pytest
      - name: Run showsys --gpu
        run: |
          showsys --gpu
          showsys --gpu --json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the type hints
        # Settings are in setup.cfg ([mypy], strict).
        run: |
          pip install . mypy==2.4.1 types-psutil==7.2.2.20260906
          mypy src/showsys

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
